[project]
name = "owcore"
version = "0.1.0"
description = "Núcleo compartilhado dos microsserviços do OW Editor"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
s3 = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["owcore*"]
